# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Keeps the (currently EOL) dependency stack under continuous update pressure.
# Grouped where possible to reduce PR noise; the backend/frontend major
# framework upgrades are handled deliberately in the modernization phases,
# so Dependabot here is mainly for security patches and minor bumps.
version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/guacozy_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # React frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dockerfiles (root production image + dev images)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/frontend"
      - "/guacozy_server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions workflows (added in the CI/CD phase)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
